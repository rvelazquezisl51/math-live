<style>
:root{--purple:#5b43b5;--purple2:#7659da;--yellow:#ffd15c;--green:#17806b;--ink:#26203c;--muted:#746d88;--line:#ded8f2;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f4ff url('assets/math-live-world-clean.webp?v=581') center/cover fixed no-repeat;color:var(--ink)}body{min-height:100vh;display:flex;flex-direction:column}.top{background:linear-gradient(125deg,#4e36a5,#674fc5);color:#fff;border-bottom:5px solid var(--yellow);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:clamp(28px,4vw,50px);font-weight:950}.brand span{color:var(--yellow)}.sub{font-size:12px;font-weight:850;letter-spacing:1.3px;text-transform:uppercase;opacity:.88}.timer{font-size:clamp(32px,5vw,64px);font-weight:950;background:#ffffff18;border:2px solid #ffffff40;border-radius:20px;padding:4px 18px;min-width:180px;text-align:center}.wrap{flex:1;padding:18px 24px 12px;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#ffffff10,#ffffff26)}.hero{text-align:center;background:#ffffffdc;backdrop-filter:blur(8px);border:2px solid #ffffffaa;border-radius:26px;padding:10px 18px;max-width:1100px;margin:0 auto 8px;box-shadow:0 12px 35px #2b23652a}.label{font-size:13px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--purple)}.code{font-size:clamp(54px,10vw,112px);font-weight:1000;letter-spacing:.12em;color:var(--purple);line-height:1}.meta{font-size:clamp(16px,2vw,24px);font-weight:800;color:var(--muted);margin:5px}.count{display:inline-block;background:#fff4c9;border:1px solid #efd16d;border-radius:999px;padding:7px 15px;font-weight:900;margin:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;align-content:start;overflow:hidden;margin-top:10px}.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;box-shadow:0 6px 18px #392a7810;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .25s}.face{width:64px;height:64px;margin:0 auto 4px;border-radius:50%;overflow:hidden;background:#eef6ff}.face img{width:100%;height:100%;object-fit:cover;display:block}.name{font-size:clamp(12px,1.6vw,18px);font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state{font-size:12px;font-weight:850;color:var(--green);margin-top:3px}.bar{height:9px;background:#ece8f7;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#7659da,#ffd15c);border-radius:inherit;transition:width .45s ease}.rank{font-size:20px;font-weight:1000;color:var(--purple);float:left}.modeBanner{background:#ffffffdc;backdrop-filter:blur(8px);border-radius:18px;padding:6px 12px;text-align:center;font-size:clamp(18px,2.5vw,30px);font-weight:950;margin:4px 0 2px}.modeHint{display:table;margin:4px auto;background:#ffffffd9;border-radius:999px;padding:5px 12px;text-align:center;color:var(--muted);font-weight:750;font-size:13px}.finalTitle{text-align:center;font-size:clamp(28px,4vw,52px);font-weight:1000;margin:3px}.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:8px auto 14px;min-height:170px}.pod{width:min(25vw,220px);background:#fff;border:2px solid var(--line);border-radius:22px 22px 12px 12px;text-align:center;padding:12px;box-shadow:0 10px 24px #392a7818}.pod.first{min-height:165px;border-color:#e4b735}.pod.second{min-height:135px}.pod.third{min-height:115px}.medal{font-size:34px}.pod .face{width:78px;height:78px}.pod .name{font-size:18px}.results{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);font-size:20px;padding:35px}.error{max-width:700px;margin:auto;background:#fff1f2;border:2px solid #efb7c0;border-radius:18px;padding:20px;text-align:center;font-weight:800}.foot{text-align:center;font-size:10px;color:#7b748e;padding:4px 10px 8px}
body[data-mode="challenge"] .card{border-color:#ffd15c}body[data-mode="discover"] .fill{background:linear-gradient(90deg,#3478c7,#61c9b6)}body[data-mode="memory"] .fill{background:linear-gradient(90deg,#ec5f91,#ffd15c)}body[data-mode="crossword"] .fill{background:linear-gradient(90deg,#167b67,#75d5aa)}body[data-mode="build"] .fill{background:linear-gradient(90deg,#e77b35,#ffd15c)}
